services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mocklet
      POSTGRES_USER: mocklet
      POSTGRES_PASSWORD: ${MOCKLET_DB_PASSWORD:?set MOCKLET_DB_PASSWORD}
    volumes:
      - mocklet-postgres:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocklet -d mocklet"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/frachman/mocklet-api:${MOCKLET_IMAGE_TAG:?set MOCKLET_IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://mocklet:${MOCKLET_DB_PASSWORD}@postgres:5432/mocklet?sslmode=disable
      API_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
      - web

  web:
    image: ghcr.io/frachman/mocklet-web:${MOCKLET_IMAGE_TAG:?set MOCKLET_IMAGE_TAG}
    environment:
      NEXT_PUBLIC_API_ORIGIN: https://mocklet.mikrolyt.com
    depends_on:
      - api
    networks:
      - web

networks:
  private:
    internal: true
  web:
    external: true

volumes:
  mocklet-postgres:
