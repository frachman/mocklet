services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mocklet
      POSTGRES_USER: mocklet
      POSTGRES_PASSWORD: mocklet_dev
    ports:
      - "${MOCKLET_DB_PORT:-5432}:5432"
    volumes:
      - mocklet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocklet -d mocklet"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://mocklet:mocklet_dev@postgres:5432/mocklet?sslmode=disable
      API_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MOCKLET_API_PORT:-8080}:8080"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "${MOCKLET_WEB_PORT:-3000}:3000"
volumes:
  mocklet-postgres:
